    <text x="682" y="460" text-anchor="middle" fill="#7b93b2" font-size="9">SAFE/CAUTION/DANGER + safe</text>
    <text x="682" y="474" text-anchor="middle" fill="#7b93b2" font-size="9">sailing window · storm track</text>

    <rect x="820" y="426" width="235" height="62" rx="10" fill="#0a1f38" stroke="#34d399" stroke-width="1.4"/>
    <text x="937" y="445" text-anchor="middle" font-weight="800" fill="#a7f3d0">Risk Index + Report</text>
    <text x="937" y="460" text-anchor="middle" fill="#7b93b2" font-size="9">weighted composite risk</text>
    <text x="937" y="474" text-anchor="middle" fill="#7b93b2" font-size="9">executive summary · CSV</text>

    <rect x="1075" y="426" width="190" height="62" rx="10" fill="#0a1f38" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="1170" y="445" text-anchor="middle" font-weight="800" fill="#a5f3fc">NLP Assistant</text>
    <text x="1170" y="460" text-anchor="middle" fill="#7b93b2" font-size="9">safety · trends · compare</text>
    <text x="1170" y="474" text-anchor="middle" fill="#7b93b2" font-size="9">superlatives</text>
  </g>
  <text x="1280" y="556" text-anchor="end" font-size="9" fill="#7b93b2">WebSocket broadcast: /api/v1/safety/ws/live every 12s</text>

  <!-- connector -->

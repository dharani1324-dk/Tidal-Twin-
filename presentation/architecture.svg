  <!-- ============ LAYER 1: DATA ============ -->
  <rect x="30" y="176" width="1260" height="118" rx="14" fill="rgba(8,25,50,0.6)" stroke="rgba(56,189,248,0.35)" stroke-width="1.2"/>
  <rect x="30" y="176" width="1260" height="26" rx="14" fill="rgba(56,189,248,0.12)"/>
  <text x="46" y="193" font-size="11" font-weight="800" fill="#38bdf8" letter-spacing="2">DATA LAYER</text>

  <g font-size="11">
    <rect x="55" y="214" width="330" height="66" rx="10" fill="#0a1f38" stroke="rgba(56,189,248,0.5)"/>
    <text x="70" y="234" font-weight="800" fill="#e6f1ff">Open-Meteo Marine API</text>
    <text x="70" y="252" fill="#7b93b2">Live coastal observations — temp, waves,</text>
    <text x="70" y="266" fill="#7b93b2">salinity, currents (ERA5-driven)</text>

    <rect x="495" y="214" width="330" height="66" rx="10" fill="#0a1f38" stroke="rgba(129,140,248,0.5)"/>
    <text x="510" y="234" font-weight="800" fill="#e6f1ff">PostgreSQL 16 + PostGIS</text>
    <text x="510" y="252" fill="#7b93b2">384+ observations · 8 Indian coastal regions</text>
    <text x="510" y="266" fill="#7b93b2">time-series + geospatial (SRID 4326)</text>

    <rect x="935" y="214" width="330" height="66" rx="10" fill="#0a1f38" stroke="rgba(244,63,94,0.5)"/>
    <text x="950" y="234" font-weight="800" fill="#e6f1ff">Simulated Heatwave Events</text>
    <text x="950" y="252" fill="#7b93b2">Inject controlled anomaly scenarios to</text>
    <text x="950" y="266" fill="#7b93b2">prove live detection and model-obs</text>
    <text x="950" y="276" fill="#7b93b2">mismatch response</text>
  </g>

  <!-- connector -->
  <line x1="660" y1="294" x2="660" y2="312" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>


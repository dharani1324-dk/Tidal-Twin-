  <rect x="30" y="314" width="1260" height="252" rx="14" fill="rgba(9,26,52,0.6)" stroke="rgba(129,140,248,0.35)" stroke-width="1.2"/>
  <rect x="30" y="314" width="1260" height="26" rx="14" fill="rgba(129,140,248,0.12)"/>
  <text x="46" y="331" font-size="11" font-weight="800" fill="#a5b4fc" letter-spacing="2">BACKEND — FASTAPI AI ENGINES</text>

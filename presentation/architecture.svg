    <text x="1170" y="400" text-anchor="middle" fill="#7b93b2" font-size="9">(labelled, not a forecast)</text>

    <rect x="55" y="426" width="235" height="62" rx="10" fill="#0a1f38" stroke="#f59e0b" stroke-width="1.4"/>

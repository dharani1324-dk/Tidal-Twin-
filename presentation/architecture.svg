    <text x="172" y="460" text-anchor="middle" fill="#7b93b2" font-size="9">Isolation Forest + z-score</text>
    <text x="172" y="474" text-anchor="middle" fill="#7b93b2" font-size="9">severity + confidence</text>

    <rect x="310" y="426" width="235" height="62" rx="10" fill="#0a1f38" stroke="#f59e0b" stroke-width="1.4"/>
    <text x="427" y="445" text-anchor="middle" font-weight="800" fill="#fcd34d">AI Forecasting</text>
    <text x="427" y="460" text-anchor="middle" fill="#7b93b2" font-size="9">12-h temperature + waves</text>
    <text x="427" y="474" text-anchor="middle" fill="#7b93b2" font-size="9">verified vs reality (MAE)</text>

    <rect x="565" y="426" width="235" height="62" rx="10" fill="#0a1f38" stroke="#f43f5e" stroke-width="1.4"/>

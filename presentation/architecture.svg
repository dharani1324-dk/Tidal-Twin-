<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061228"/>
      <stop offset="1" stop-color="#0a2a4a"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="1320" height="820" fill="url(#bg)"/>

  <!-- Title -->
  <text x="660" y="40" text-anchor="middle" font-size="24" font-weight="800" fill="#e6f1ff">TidalTwin — System Architecture &amp; Scientific Intelligence Pipeline</text>
  <text x="660" y="62" text-anchor="middle" font-size="12" fill="#7dd3fc">Interactive 4D Ocean Model Validation &amp; Decision Intelligence Platform</text>

  <!-- ============ PIPELINE BAND ============ -->
  <g font-size="11" font-weight="700" text-anchor="middle">
    <text x="660" y="90" font-size="13" fill="#94a3b8" font-weight="800">THE SCIENTIFIC INTELLIGENCE PIPELINE</text>
    <g>
      <rect x="30"  y="104" width="135" height="40" rx="10" fill="#0a1f38" stroke="#38bdf8" stroke-width="1.4"/>
      <text x="97"  y="120" fill="#38bdf8">DATA</text>
      <text x="97"  y="134" fill="#7b93b2" font-size="9" font-weight="600">Live Marine APIs</text>
      <rect x="180" y="104" width="135" height="40" rx="10" fill="#0a1f38" stroke="#38bdf8" stroke-width="1.4"/>
      <text x="247" y="120" fill="#38bdf8">QC</text>
      <text x="247" y="134" fill="#7b93b2" font-size="9" font-weight="600">Quality Check</text>
      <rect x="330" y="104" width="135" height="40" rx="10" fill="#0a1f38" stroke="#38bdf8" stroke-width="1.4"/>
      <text x="397" y="120" fill="#38bdf8">MATCHING</text>
      <text x="397" y="134" fill="#7b93b2" font-size="9" font-weight="600">Model ⇄ Observed</text>
      <rect x="480" y="104" width="135" height="40" rx="10" fill="#0a1f38" stroke="#fbbf24" stroke-width="1.4"/>
      <text x="547" y="120" fill="#fbbf24">DEVIATION</text>
      <text x="547" y="134" fill="#7b93b2" font-size="9" font-weight="600">Field-by-field gap</text>
      <rect x="630" y="104" width="135" height="40" rx="10" fill="#0a1f38" stroke="#fbbf24" stroke-width="1.4"/>
      <text x="697" y="120" fill="#fbbf24">UNCERTAINTY</text>
      <text x="697" y="134" fill="#7b93b2" font-size="9" font-weight="600">Confidence components</text>
      <rect x="780" y="104" width="135" height="40" rx="10" fill="#0a1f38" stroke="#f43f5e" stroke-width="1.4"/>
      <text x="847" y="120" fill="#f43f5e">EVENT</text>
      <text x="847" y="134" fill="#7b93b2" font-size="9" font-weight="600">Phenomena classified</text>
      <rect x="930" y="104" width="135" height="40" rx="10" fill="#0a1f38" stroke="#f43f5e" stroke-width="1.4"/>
      <text x="997" y="120" fill="#f43f5e">IMPACT</text>
      <text x="997" y="134" fill="#7b93b2" font-size="9" font-weight="600">Risk / advisory</text>

    <rect x="937" y="624" width="113" height="70" rx="10" fill="#0a1f38" stroke="rgba(34,211,238,0.5)"/>
    <text x="993" y="647" text-anchor="middle" font-weight="800" fill="#e6f1ff">Story Mode</text>
    <text x="993" y="662" text-anchor="middle" fill="#7b93b2" font-size="8.5">Live-data narratives</text>

    <rect x="1063" y="624" width="113" height="70" rx="10" fill="#0a1f38" stroke="rgba(34,211,238,0.5)"/>

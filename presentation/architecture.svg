  <!-- ============ DECISION OUTPUTS ============ -->
  <rect x="30" y="738" width="1260" height="52" rx="14" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.4)" stroke-width="1.2"/>
  <text x="46" y="770" font-size="11" font-weight="800" fill="#4ade80" letter-spacing="2">DECISION OUTPUTS</text>

    <text x="615" y="674" text-anchor="middle" fill="#7b93b2" font-size="8.5">Voice bulletins</text>

    <rect x="685" y="624" width="113" height="70" rx="10" fill="#0a1f38" stroke="rgba(34,211,238,0.5)"/>

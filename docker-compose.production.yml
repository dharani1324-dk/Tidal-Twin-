# Production VPS stack. Publish only Caddy; database and API stay private.
# Start with: docker compose --env-file .env.production -f docker-compose.production.yml up -d --build
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tidaltwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-tidaltwin}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tidaltwin} -d ${POSTGRES_DB:-tidaltwin}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-tidaltwin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tidaltwin}
      DB_HOST: db
      DB_PORT: "5432"
      ENVIRONMENT: production
      CORS_ORIGINS: https://${TIDALTWIN_DOMAIN:?Set TIDALTWIN_DOMAIN in .env.production}
      CESIUM_ION_TOKEN: ${CESIUM_ION_TOKEN:-}
      PORT: "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      TIDALTWIN_DOMAIN: ${TIDALTWIN_DOMAIN:?Set TIDALTWIN_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
